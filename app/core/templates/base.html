<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}{% if self.title() %} · {% endif %}TTK</title>
  <link rel="stylesheet" href="/static/css/app.css">
  {% if has_datepicker %}
  <link rel="stylesheet" href="/static/vendor/nepali.datepicker.v4.min.css">
  {% endif %}
  <script src="/static/vendor/htmx.min.js" defer></script>
  {% if has_datepicker %}
  <script src="/static/vendor/nepali.datepicker.v4.min.js" defer></script>
  {% endif %}
  <script src="/static/js/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    {% include "partials/sidebar.html" %}
    <div class="main-column">
      {% include "partials/header.html" %}
      <main id="main" class="content" tabindex="-1">
        {% include "partials/flashes.html" %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <div id="modal-root" class="modal-root"></div>
</body>
</html>
