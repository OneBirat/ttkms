{% from "partials/icons.html" import icon %}
<header class="topbar">
  <div class="topbar__date" data-today>
    {% if today.available %}
      <span class="topbar__date-np" lang="ne">{{ today.np }}</span>
      <span class="topbar__sep" aria-hidden="true">·</span>
      <span>{{ today.bs_en }}</span>
      <span class="topbar__sep" aria-hidden="true">·</span>
      <span class="muted">{{ today.ad }}</span>
    {% else %}
      <span>{{ today.ad }}</span>
      <span class="topbar__note muted" title="Add static/vendor/nepali.datepicker.v4.min.js and port app/core/bs_calendar_data.py">BS calendar not installed</span>
    {% endif %}
  </div>
  {% if current_user %}
  <div class="topbar__user">
    <span class="topbar__name">{{ current_user.full_name }}</span>
    <form method="post" action="/logout" class="inline-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn--ghost btn--sm" type="submit">{{ icon("logout", 16) }}<span>Sign out</span></button>
    </form>
  </div>
  {% endif %}
</header>
