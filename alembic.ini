# One Alembic config with one named section per module. Always pass the section:
#
#   alembic -n core upgrade head
#   alembic -n stock revision --autogenerate -m "items"
#
# Each module has its own script directory (migrations/<module>/) and its own version table
# (<module>.alembic_version_<module>), so worktrees never clash. Keys under [DEFAULT] apply to
# every section. sqlalchemy.url is deliberately absent: migrations/env_helper.py reads
# DATABASE_URL from .env (tests pass config.attributes["sqlalchemy_url"]).

[DEFAULT]
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[core]
script_location = %(here)s/migrations/core

[stock]
script_location = %(here)s/migrations/stock

[attendance]
script_location = %(here)s/migrations/attendance

[payroll]
script_location = %(here)s/migrations/payroll

[admin]
script_location = %(here)s/migrations/admin

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
