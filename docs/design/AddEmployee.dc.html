<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add employee dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="ae-h" style="width: 640px; max-width: 100%; background: #FFFFFF; border-radius: 14px; box-shadow: 0 20px 50px rgba(15,24,29,.3); display: flex; flex-direction: column; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B2328">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid #E2E5E1">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 id="ae-h" style="margin: 0; font-size: 18px; font-weight: 600">Add employee</h2><span style="font-size: 13px; color: #5B6670">Employee ID E-025 is assigned automatically</span></div>
<button type="button" aria-label="Close" onClick="{{close}}" style="width: 40px; height: 40px; border-radius: 8px; border: none; background: transparent; color: #5B6670; font-size: 22px; cursor: pointer">×</button>
</div>
<div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 16px">
<div role="img" aria-label="No photo yet" style="width: 72px; height: 72px; border-radius: 50%; background: #EEF0EC; border: 2px dashed #B8C2BC; display: flex; align-items: center; justify-content: center; color: #6B757B; flex: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #CBD2CC; background: #FFFFFF; font: inherit; font-size: 13px; color: #1B2328; cursor: pointer">Take photo</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #CBD2CC; background: #FFFFFF; font: inherit; font-size: 13px; color: #1B2328; cursor: pointer">Upload</button>
<span style="width: 100%; font-size: 12px; color: #5B6670">Optional. You can add it later from a phone.</span>
</div>
</div>
<fieldset style="border: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<legend style="font-size: 12px; font-weight: 600; color: #5B6670; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 10px">Personal</legend>
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1"><label for="ae-name" style="font-size: 13px; font-weight: 600">Full name</label><div style="display: flex; align-items: center; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><input id="ae-name" placeholder="e.g. Sarita Basnet" style="border: none; outline: none; font: inherit; color: #1B2328; background: transparent; width: 100%"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1"><label for="ae-phone" style="font-size: 13px; font-weight: 600">Phone</label><div style="display: flex; align-items: center; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><input id="ae-phone" inputmode="tel" placeholder="98XXXXXXXX" style="border: none; outline: none; font: inherit; color: #1B2328; background: transparent; width: 100%"></div></div>
</fieldset>
<fieldset style="border: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<legend style="font-size: 12px; font-weight: 600; color: #5B6670; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 10px">Work</legend>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ae-branch" style="font-size: 13px; font-weight: 600">Branch</label><div style="display: flex; align-items: center; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><select id="ae-branch" style="appearance: none; -webkit-appearance: none; cursor: pointer; border: none; outline: none; font: inherit; color: #1B2328; background: transparent; width: 100%"><option value="">Choose branch</option><option selected>Main branch</option><option>Branch 2</option><option>+ Add new branch…</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6670" stroke-width="2" aria-hidden="true" style="flex: none; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ae-dept" style="font-size: 13px; font-weight: 600">Department</label><div style="display: flex; align-items: center; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><select id="ae-dept" style="appearance: none; -webkit-appearance: none; cursor: pointer; border: none; outline: none; font: inherit; color: #1B2328; background: transparent; width: 100%"><option value="">Choose department</option><option selected>Store</option><option>Kitchen</option><option>Housekeeping</option><option>Front desk</option><option>Accounts</option><option>+ Add new department…</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6670" stroke-width="2" aria-hidden="true" style="flex: none; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ae-role" style="font-size: 13px; font-weight: 600">Designation</label><div style="display: flex; align-items: center; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><input id="ae-role" placeholder="e.g. Cashier" style="border: none; outline: none; font: inherit; color: #1B2328; background: transparent; width: 100%"></div></div>
</fieldset>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="font-size: 12px; font-weight: 600; color: #5B6670; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 10px">Salary</legend>
<div role="group" aria-label="Pay type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #EEF0EC; padding: 4px; border-radius: 10px">
<button type="button" aria-pressed="{{mOn}}" onClick="{{setMonthly}}" style="{{mBtn}}"><span style="font-weight: 600">Monthly salary</span><span style="font-size: 12px; opacity: .85">Fixed amount, absences deducted</span></button>
<button type="button" aria-pressed="{{dOn}}" onClick="{{setDaily}}" style="{{dBtn}}"><span style="font-weight: 600">Daily wage</span><span style="font-size: 12px; opacity: .85">Paid per day present</span></button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ae-amt" style="font-size: 13px; font-weight: 600">{{amtLabel}}</label><div style="display: flex; align-items: center; gap: 6px; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><span style="font-size: 13px; color: #5B6670">Rs</span><input id="ae-amt" inputmode="numeric" value="{{amt}}" onInput="{{setAmt}}" style="border: none; outline: none; font: inherit; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #1B2328; background: transparent; width: 100%"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ae-paid" style="font-size: 13px; font-weight: 600">Paid by</label><div style="display: flex; align-items: center; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><select id="ae-paid" style="appearance: none; -webkit-appearance: none; cursor: pointer; border: none; outline: none; font: inherit; color: #1B2328; background: transparent; width: 100%"><option>Cash</option><option>Bank</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6670" stroke-width="2" aria-hidden="true" style="flex: none; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></div></div>
</div>
<div style="background: #F3F8F7; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #3E4A52; display: flex; flex-direction: column; gap: 4px"><span>{{rule}}</span><span>{{exLabel}} <strong style="font-family: 'IBM Plex Mono', monospace; color: #0A5454">Rs {{example}}</strong></span></div>
</fieldset>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 12px; font-weight: 600; color: #5B6670; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 10px">App login</legend>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{login}}" onChange="{{toggleLogin}}" style="width: 18px; height: 18px; accent-color: #0E6B6B">Let this employee sign in</label>
<sc-if value="{{login}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ae-user" style="font-size: 13px; font-weight: 600">Username</label><div style="display: flex; align-items: center; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><input id="ae-user" placeholder="e.g. sarita.b" style="border: none; outline: none; font: inherit; color: #1B2328; background: transparent; width: 100%"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ae-role2" style="font-size: 13px; font-weight: 600">Access</label><div style="display: flex; align-items: center; border: 1px solid #CBD2CC; border-radius: 8px; padding: 0 12px; min-height: 44px; box-sizing: border-box"><select id="ae-role2" style="appearance: none; -webkit-appearance: none; cursor: pointer; border: none; outline: none; font: inherit; color: #1B2328; background: transparent; width: 100%"><option>Staff · own attendance and payslips</option><option>Store keeper · stock entry</option><option>Manager · attendance and reports</option><option>Admin · everything</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6670" stroke-width="2" aria-hidden="true" style="flex: none; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></div></div>
<span style="grid-column: 1 / -1; font-size: 12px; color: #5B6670">A one-time password is shown after saving; they set their own on first sign-in.</span>
</div>
</sc-if>
</fieldset>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid #E2E5E1">
<button type="button" onClick="{{close}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #CBD2CC; background: #FFFFFF; font: inherit; font-size: 14px; color: #1B2328; cursor: pointer">Cancel</button>
<button type="button" onClick="{{close}}" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: none; background: #0E6B6B; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Save employee</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":640,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var s = this.state || {};
var daily = s.pay === 'daily';
var amt = s.amt === undefined ? (daily ? '800' : '22000') : s.amt;
var login = !!s.login;
var n = function (v) { var x = parseFloat(v); return isNaN(x) ? 0 : x; };
var fmt = function (v) { return Math.round(v).toLocaleString('en-IN'); };
var on = 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 56px; padding: 8px 14px; border-radius: 8px; border: none; font: inherit; font-size: 14px; text-align: left; cursor: pointer; ';
return {
close: function () { if (self.props.onClose) self.props.onClose(); },
mOn: daily ? 'false' : 'true', dOn: daily ? 'true' : 'false',
mBtn: on + (daily ? 'background: transparent; color: #3E4A52' : 'background: #FFFFFF; color: #0A5454; box-shadow: 0 1px 2px rgba(23,34,42,.12)'),
dBtn: on + (daily ? 'background: #FFFFFF; color: #0A5454; box-shadow: 0 1px 2px rgba(23,34,42,.12)' : 'background: transparent; color: #3E4A52'),
setMonthly: function () { self.setState({ pay: 'monthly', amt: undefined }); },
setDaily: function () { self.setState({ pay: 'daily', amt: undefined }); },
amtLabel: daily ? 'Wage per day' : 'Salary per month',
amt: amt, setAmt: function (e) { self.setState({ amt: e.target.value }); },
rule: daily ? 'Pay = wage × days present. A half day counts as ½; leave and absent days are unpaid.' : 'Pay = monthly salary − (salary ÷ days in month × absent days). Leave and Saturdays are paid; a half day deducts ½ day.',
example: daily ? fmt(n(amt) * 26) : fmt(n(amt) - n(amt) / 30 * 2),
exLabel: daily ? 'Example, 26 days present this month:' : 'Example, 30-day month with 2 absent days:',
login: login,
toggleLogin: function () { self.setState({ login: !login }); }
};
}
}
</script>
</body>
</html>
